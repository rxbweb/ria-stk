
<section class="section section--account">
  <div class="section__wrapper container">
    <div class="section__content">
      <div class="account">
        <div class="account__inner">
          <div class="account__form">
            <div class="webform">
              <h2 class="webform__title">Восстановить пароль</h2>
              <form class="webform__form webform__form--narrow" action="#" data-validate-form="data-validate-form">
                <div class="webform__body">
                  <p class="webform__description">Если вы забыли пароль, введите логин или Email и следуйте инструкции  в электронном письме.</p>
                  <div class="webform__inputs">
                    <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Логин или Email</span><span class="webform__label-error">Обязательное поле</span></span><span class="webform__label-field">
                        <input class="webform__label-input" type="text" placeholder="Введите логин или email" name="login" minlength="3" required="required"/></span><span class="webform__label-row"><span class="webform__label-note">Минимум 3 символа</span></span></label>
                  </div>
                  <button class="button button--large webform__button"><span>Отправить</span>
                  </button>
                </div>
                <div class="webform__bottom">
                  <div class="webform__manage"><a class="button button--outline" href="#"><span>Вернуться  к авторизации</span><span class="button__icon">
                        <svg class="svg-icon-arrow-right" width="17" height="17">
                          <use xlink:href="images/sprites/main.stack.svg#svg-icon-arrow-right"></use>
                        </svg></span></a>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
