
<section class="section section--newspaper">
  <div class="section__wrapper container">
    <div class="section__content">
      <div class="newspaper">
        <div class="bg-image">
          <picture class="lazyload">
            <source srcset="images/icons/empty.png" data-srcset="images/newspaper/newspaper-bg-mob.webp" media="(max-width: 575px)" type="image/webp"/>
            <source srcset="images/icons/empty.png" data-srcset="images/newspaper/newspaper-bg-mob.jpg" media="(max-width: 575px)"/>
            <source srcset="images/icons/empty.png" data-srcset="images/newspaper/newspaper-bg.webp"/><img src="images/icons/empty.png" data-src="images/newspaper/newspaper-bg.jpg" alt="фоновая картинка" width="1640" height="550"/>
          </picture>
        </div>
        <div class="newspaper__inner">
          <div class="newspaper__row">
            <div class="newspaper__info">
              <h2 class="newspaper__title">Газета Quality News — качественные новости каждый четверг</h2><a class="button" href="#"><span>Подробнее</span><span class="button__icon">
                  <svg class="svg-icon-arrow-right" width="17" height="17">
                    <use xlink:href="images/sprites/main.stack.svg#svg-icon-arrow-right"></use>
                  </svg></span></a>
            </div>
            <div class="newspaper__img">
              <picture class="lazyload">
                <source srcset="images/icons/empty.png" data-srcset="images/newspaper/newspaper-mob.webp" media="(max-width: 575px)" type="image/webp"/>
                <source srcset="images/icons/empty.png" data-srcset="images/newspaper/newspaper-mob.png" media="(max-width: 575px)"/>
                <source srcset="images/icons/empty.png" data-srcset="images/newspaper/newspaper.webp"/><img src="images/icons/empty.png" data-src="images/newspaper/newspaper.png" alt="Газета Quality News" width="700" height="550"/>
              </picture>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
