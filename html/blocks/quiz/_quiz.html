
<section class="section">
  <div class="section__wrapper">
    <div class="section__content">
      <div class="quiz">
        <div class="quiz__inner container">
          <div class="quiz__row">
            <form class="quiz__form form form--large" action="#">
              <div class="form__header form__header--border">
                <h2 class="form__heading">Какой журнал вам подходит?</h2>
              </div>
              <div class="form__main">
                <div class="form__list">
                  <div class="form__col">
                    <div class="form__col-item">
                      <h3 class="form__name"><span class="form__name-number">01</span>Кто вы по профессии?</h3>
                      <div class="form__block">
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Инженер-технолог</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Метролог</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Сотрудник лаборатории</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Специалист в области стандартизации</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Специалист в области сертификации</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Специалист по качеству</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Организатор здравоохранения</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="profession"/><span class="form__radio-field"></span><span>Руководитель организации</span>
                        </label>
                      </div>
                    </div>
                  </div>
                  <div class="form__col">
                    <div class="form__col-item">
                      <h3 class="form__name"><span class="form__name-number">02</span>Тематика статьи?</h3>
                      <div class="form__block">
                        <label class="form__radio">
                          <input type="radio" name="theme"/><span class="form__radio-field"></span><span>Техническое регулирование</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="theme"/><span class="form__radio-field"></span><span>Стандартизация</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="theme"/><span class="form__radio-field"></span><span>Обеспечение единства измерений</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="theme"/><span class="form__radio-field"></span><span>Развертывание СМК</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="theme"/><span class="form__radio-field"></span><span>Интегрированные системы менеджмента</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="theme"/><span class="form__radio-field"></span><span>Деловое совершенство</span>
                        </label>
                      </div>
                    </div>
                  </div>
                  <div class="form__col">
                    <div class="form__col-item">
                      <h3 class="form__name"><span class="form__name-number">03</span>Научная статья?</h3>
                      <div class="form__block">
                        <label class="form__radio">
                          <input type="radio" name="scientific"/><span class="form__radio-field"></span><span>Да</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="scientific"/><span class="form__radio-field"></span><span>Нет</span>
                        </label>
                      </div>
                    </div>
                    <div class="form__col-item">
                      <h3 class="form__name"><span class="form__name-number">04</span>Рецензируемый журнал?</h3>
                      <div class="form__block">
                        <label class="form__radio">
                          <input type="radio" name="reviewed"/><span class="form__radio-field"></span><span>Да</span>
                        </label>
                        <label class="form__radio">
                          <input type="radio" name="reviewed"/><span class="form__radio-field"></span><span>Нет</span>
                        </label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form__footer">
                  <button class="button"><span>Посмотреть результат</span><span class="button__icon">
                      <svg class="svg-icon-arrow-right" width="17" height="17">
                        <use xlink:href="images/sprites/main.stack.svg#svg-icon-arrow-right"></use>
                      </svg></span>
                  </button>
                </div>
              </div>
            </form>
            <div class="quiz__result">
              <h2 class="quiz__result-title">Вам подходит:</h2>
              <div class="quiz__result-content">
                <div class="quiz__result-img">
                  <picture class="lazyload">
                    <source srcset="images/icons/empty.png" data-srcset="images/journals/journals-01.webp"/><img src="images/icons/empty.png" data-src="images/journals/journals-01.png" alt="Cтандарты и качество" width="200" height="auto"/>
                  </picture>
                </div>
              </div>
              <div class="quiz__result-info">
                <h3 class="quiz__result-name">стандарты и качество</h3><a class="button button--outline quiz__result-button" href="#"><span>Подробнее</span><span class="button__icon">
                    <svg class="svg-icon-arrow-right" width="17" height="17">
                      <use xlink:href="images/sprites/main.stack.svg#svg-icon-arrow-right"></use>
                    </svg></span></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
