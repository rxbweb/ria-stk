
<section class="section section--response">
  <div class="section__wrapper container">
    <div class="section__header">
      <div class="section__header-row">
        <h2 class="section__header-title">Напишите нам, и мы составим
          индивидуальную подборку для вас
        </h2>
      </div>
    </div>
    <div class="section__content">
      <div class="response">
        <div class="response__main">
          <form class="response__form form" action="#" data-validate-form="data-validate-form">
            <div class="form__main">
              <div class="form__top">
                <div class="form__box">
                  <label class="form__label form__label--half">
                    <input class="form__input" type="text" placeholder="Имя" name="form-name" required="required"/><span class="form__error">Обязательное поле</span>
                  </label>
                  <label class="form__label form__label--half">
                    <input class="form__input" type="text" placeholder="Фамилия"/>
                  </label>
                  <label class="form__label">
                    <input class="form__input" type="email" placeholder="E-mail" name="form-email" required="required"/><span class="form__error">Обязательное поле</span>
                  </label>
                  <label class="form__label">
                    <textarea class="form__textarea" placeholder="Текст сообщения"></textarea>
                  </label>
                </div>
              </div>
              <div class="form__middle">
                <div class="agree">
                  <label class="agree__label">
                    <input type="checkbox" name="form-agree" required="required"/><span class="agree__checkbox"></span><span class="agree__text">Я согласен с <a href="#">Правилами обработки и хранения персональных данных</a></span>
                  </label><span class="agree__error">Обязательное поле</span>
                </div>
              </div>
              <div class="form__bottom">
                <button class="button form__button"><span>Подписаться</span>
                </button>
              </div>
            </div>
          </form>
          <div class="response__img">
            <picture class="lazyload">
              <source srcset="images/icons/empty.png" data-srcset="images/response/response.webp"/><img src="images/icons/empty.png" data-src="images/response/response.jpg" alt="Картинка инвидидуальной подборки" width="700" height="448"/>
            </picture>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
