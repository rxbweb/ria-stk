
<div class="webform">
  <form class="webform__form" action="#" data-validate-form="data-validate-form">
    <div class="webform__body">
      <div class="webform__header">
        <h3 class="webform__name">Нужна помощь? Сообщите нам</h3>
      </div>
      <p>Заполните эту форму, если вы не получили обратную связь по рукописи или у вас появился какой-нибудь вопрос.</p>
      <div class="webform__inputs">
        <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Тема обращения</span><span class="webform__label-error">Обязательное поле</span></span><span class="webform__label-field">
            <input class="webform__label-input" type="text" placeholder="Тема обращения" name="webform-theme" required="required"/></span></label>
        <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Текст обращения</span></span><span class="webform__label-field">
            <textarea class="webform__label-textarea" placeholder="Коротко объясните суть проблемы (необязательно)"></textarea></span></label>
      </div>
      <button class="button webform__button"><span>Отправить</span>
      </button>
    </div>
  </form>
</div>
