
<div class="webform">
  <h2 class="webform__title">Регистрация</h2>
  <form class="webform__form webform__form--narrow" action="#" data-validate-form="data-validate-form">
    <div class="webform__body">
      <div class="webform__top">
        <div class="webform__accounts"><a class="webform__accounts-btn" href="#" aria-label="vkontakte"><img src="images/icons/vk.svg" alt="vk" width="39" height="23"/></a><a class="webform__accounts-btn" href="#" aria-label="yandex"><img src="images/icons/yandex.svg" alt="yandex" width="40" height="40"/></a><a class="webform__accounts-btn" href="#" aria-label="gmail"><img src="images/icons/gmail.svg" alt="gmail" width="34" height="36"/></a></div>
        <p class="webform__remark"><span>или через email</span></p>
      </div>
      <div class="webform__inputs">
        <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Логин</span><span class="webform__label-error">Обязательное поле</span></span><span class="webform__label-field">
            <input class="webform__label-input" type="text" placeholder="Логин" name="login" minlength="3" required="required"/></span><span class="webform__label-row"><span class="webform__label-note">Минимум 3 символа</span></span></label>
        <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Email</span><span class="webform__label-error">Обязательное поле</span></span><span class="webform__label-field">
            <input class="webform__label-input" type="email" placeholder="Электронная почта" name="email" required="required"/></span></label>
        <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Пароль</span><span class="webform__label-error">Обязательное поле</span></span><span class="webform__label-field webform__label-field--icon">
            <input class="webform__label-input" type="password" placeholder="Пароль" name="password" minlength="6" required="required"/><span class="webform__label-icon webform__label-icon--eye button-eye">
              <svg class="svg-icon-eye" width="22" height="16">
                <use xlink:href="images/sprites/main.stack.svg#svg-icon-eye"></use>
              </svg>
              <svg class="svg-icon-eye-not" width="24" height="18">
                <use xlink:href="images/sprites/main.stack.svg#svg-icon-eye-not"></use>
              </svg></span></span><span class="webform__label-row"><span class="webform__label-note">Минимум 6 символов</span></span></label>
        <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Подтверждение пароля</span><span class="webform__label-error">Обязательное поле</span></span><span class="webform__label-field webform__label-field--icon">
            <input class="webform__label-input" type="password" placeholder="Пароль" name="password" required="required"/><span class="webform__label-icon webform__label-icon--eye button-eye">
              <svg class="svg-icon-eye" width="22" height="16">
                <use xlink:href="images/sprites/main.stack.svg#svg-icon-eye"></use>
              </svg>
              <svg class="svg-icon-eye-not" width="24" height="18">
                <use xlink:href="images/sprites/main.stack.svg#svg-icon-eye-not"></use>
              </svg></span></span></label>
      </div>
      <div class="agree agree--secondary">
        <label class="agree__label">
          <input type="checkbox" name="form-agree" required="required"/><span class="agree__checkbox"></span><span class="agree__text">Даю согласие на отправку мне издательством РИА СТК электронных рассылок</span>
        </label>
        <div class="agree__error">Обязательное поле</div>
      </div>
      <button class="button button--large"><span>Зарегистрироваться</span>
      </button>
      <p class="webform__description">Нажимая кнопку, вы принимаете условия <a href="#">политики</a> и <a href="#">пользовательского соглашения</a></p>
    </div>
    <div class="webform__bottom">
      <div class="webform__manage"><span>Уже есть аккаунт?</span><a class="button button--outline" href="#"><span>Войти</span><span class="button__icon">
            <svg class="svg-icon-arrow-right" width="17" height="17">
              <use xlink:href="images/sprites/main.stack.svg#svg-icon-arrow-right"></use>
            </svg></span></a>
      </div>
    </div>
  </form>
</div>
