
<div class="webform">
  <form class="webform__form" action="#" data-validate-form="data-validate-form">
    <div class="webform__body">
      <div class="webform__header">
        <h3 class="webform__name">Загрузить новую рукопись</h3>
      </div>
      <div class="webform__inputs">
        <label class="webform__label"><span class="webform__label-row"><span class="webform__label-title">Название рукописи</span><span class="webform__label-error">Обязательное поле</span></span><span class="webform__label-field">
            <input class="webform__label-input" type="text" placeholder="Введите название рукописи" name="webform-manuscript" required="required"/></span></label>
      </div>
      <div class="download">
        <ul class="download__list">
          <li class="download__item">
            <label class="download__label"><span class="download__top"><span class="download__name">Ваша рукопись</span></span><span class="download__box">
                <input type="file"/><span class="download__icon">
                  <svg width="35" height="35">
                    <use href="images/sprites/main.stack.svg#svg-icon-download"></use>
                  </svg></span><span class="download__default"><span class="download__manual">Нажмите, чтобы загрузить файл<span>, либо перетащите сюда</span></span><span class="download__description">DOC, PDF или TXT до 10 МБ</span></span><span class="download__loading"><span class="download__process"><span class="download__file">123newfile.pdf</span><span class="download__size">9 МБ</span></span><span class="download__description">Файл загружается...</span></span><span class="download__loaded"><span class="download__process"><span class="download__file">123newfile.pdf</span><span class="download__size">Файл успешно загружен</span></span><span class="download__delete">Удалить файл</span></span></span></label>
          </li>
          <li class="download__item">
            <label class="download__label"><span class="download__top"><span class="download__name">Публичная оферта</span></span><span class="download__box">
                <input type="file"/><span class="download__icon">
                  <svg width="35" height="35">
                    <use href="images/sprites/main.stack.svg#svg-icon-download"></use>
                  </svg></span><span class="download__default"><span class="download__manual">Нажмите, чтобы загрузить файл<span>, либо перетащите сюда</span></span><span class="download__description">DOC, PDF или TXT до 10 МБ</span></span><span class="download__loading"><span class="download__process"><span class="download__file">123newfile.pdf</span><span class="download__size">9 МБ</span></span><span class="download__description">Файл загружается...</span></span><span class="download__loaded"><span class="download__process"><span class="download__file">123newfile.pdf</span><span class="download__size">Файл успешно загружен</span></span><span class="download__delete">Удалить файл</span></span></span></label>
          </li>
        </ul>
      </div>
      <div class="webform__controls">
        <div class="agree">
          <label class="agree__label">
            <input type="checkbox" name="webform-agree" required="required"/><span class="agree__checkbox"></span><span class="agree__text">Ознакомлен с <a href="#">редакционной политикой</a></span>
          </label><span class="agree__error">Обязательное поле</span>
        </div>
      </div>
      <button class="button webform__button"><span>Отправить</span>
      </button>
    </div>
  </form>
</div>
