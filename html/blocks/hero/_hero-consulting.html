
<section class="section section--hero section--padding-none section--margin-bottom">
  <div class="section__wrapper">
    <div class="section__content">
      <div class="hero">
        <div class="bg-image"><img src="images/hero/hero-bg.jpg" alt="фоновая картинка" width="1920" height="750"/></div>
        <div class="hero__inner container">
          <div class="breadcrumbs">
            <div class="breadcrumbs__inner container">
              <div class="breadcrumbs__list"><a href="#">Главная</a><span>Консалтинг</span>
              </div>
            </div>
          </div>
          <div class="hero__box">
            <form class="hero__form form" action="#" data-validate-form="data-validate-form">
              <div class="form__header">
                <h2 class="form__title">Консалтинг</h2>
                <p class="form__text">Наши эксперты проведут консультации по широкому кругу вопросов в сфере технического регулирования, стандартизации и управления качеством. Помогут разобраться, как оптимизировать бизнес-процессы и сократить издержки компании.</p>
              </div>
              <div class="form__main">
                <div class="form__top">
                  <div class="form__box">
                    <label class="form__label">
                      <input class="form__input" type="text" placeholder="ФИО"/>
                    </label>
                    <label class="form__label">
                      <input class="form__input" type="email" placeholder="E-mail" name="form-email" required="required"/><span class="form__error">Обязательное поле</span>
                    </label>
                    <label class="form__label">
                      <input class="form__input" type="tel" placeholder="Телефон" name="form-email" required="required"/><span class="form__error">Обязательное поле</span>
                    </label>
                    <label class="form__label">
                      <input class="form__input" type="text" placeholder="Компания"/>
                    </label>
                    <label class="form__label">
                      <input class="form__input" type="text" placeholder="Сообщения"/>
                    </label>
                  </div>
                </div>
                <div class="form__middle">
                  <div class="agree">
                    <label class="agree__label">
                      <input type="checkbox" name="form-agree" required="required"/><span class="agree__checkbox"></span><span class="agree__text">Я согласен с <a href="#">Правилами обработки и хранения персональных данных</a></span>
                    </label><span class="agree__error">Обязательное поле</span>
                  </div>
                </div>
                <div class="form__bottom">
                  <button class="button form__button"><span>Отправить</span>
                  </button>
                </div>
              </div>
            </form>
            <div class="hero__picture">
              <picture>
                <source srcset="images/hero/hero-consulting-mob.webp" media="(max-width: 575px)" type="image/webp"/>
                <source srcset="images/hero/hero-consulting-mob.jpg" media="(max-width: 575px)"/>
                <source srcset="images/hero/hero-consulting.webp"/><img src="images/hero/hero-consulting.jpg" alt="картинка" width="709" height="690"/>
              </picture>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
