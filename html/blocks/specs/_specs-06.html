
<section class="section section--specs">
  <div class="section__wrapper">
    <div class="section__content">
      <div class="specs specs--2 specs--3">
        <div class="bg-image">
          <picture class="lazyload">
            <source srcset="images/icons/empty.png" data-srcset="images/global/global-bg-mob.webp" media="(max-width: 575px)" type="image/webp"/>
            <source srcset="images/icons/empty.png" data-srcset="images/global/global-bg-mob.jpg" media="(max-width: 575px)"/>
            <source srcset="images/icons/empty.png" data-srcset="images/global/global-bg.webp"/><img src="images/icons/empty.png" data-src="images/global/global-bg.jpg" alt="фоновая картинка" width="1920" height="640"/>
          </picture>
        </div>
        <div class="specs__inner container">
          <div class="specs__box">
            <div class="specs__img"><img src="images/specs/specs-06.png" alt="Бизнес-план — стань хозяином своего дела"/></div>
            <div class="specs__info">
              <p class="specs__lead">Название подборки</p>
              <h2 class="specs__name specs__name--large">Бизнес-план — 
                стань хозяином своего дела
              </h2>
              <div class="specs__manage">
                <p class="specs__price">1 900 руб.</p>
                <div class="specs__manage-box"><a class="button button--wide" href="#"><span>В корзину</span><span class="button__icon">
                      <svg class="svg-icon-cart" width="17" height="17">
                        <use xlink:href="images/sprites/main.stack.svg#svg-icon-cart"></use>
                      </svg></span></a>
                  <button class="favorite-button" aria-label="добавить этот продукт в избранное">
                    <svg class="svg-icon-heart" width="32" height="30">
                      <use xlink:href="images/sprites/main.stack.svg#svg-icon-heart"></use>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
