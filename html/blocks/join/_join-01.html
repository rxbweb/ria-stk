
<section class="section section--join">
  <div class="section__wrapper container">
    <div class="section__content">
      <div class="join">
        <div class="join__main">
          <div class="join__info">
            <h2 class="join__title">Как оформить подписку?</h2>
            <p>Очень просто! Внесите свой электронный адрес в поле «Ваш E-mail» и нажмите кнопку.</p>
          </div>
          <form class="join__form" action="#" data-validate-form="data-validate-form">
            <div class="join__form-row">
              <input type="email" name="email" placeholder="Ваш E-mail" required="required"/><span class="join__form-error">Неправильное поле</span>
              <button class="button"><span>Подписаться</span><span class="button__icon">
                  <svg class="svg-icon-arrow-right" width="17" height="17">
                    <use xlink:href="images/sprites/main.stack.svg#svg-icon-arrow-right"></use>
                  </svg></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
