
<section class="section section--contacts">
  <div class="section__wrapper container">
    <div class="section__content">
      <div class="contacts">
        <div class="contacts__inner">
          <div class="contacts__row">
            <div class="contacts__section">
              <h2 class="contacts__title">Контакты</h2>
              <address class="contacts__address address">
                <div class="address__list address__list--second">
                  <div class="address__item">
                    <div class="address__icon"><img src="images/address/address-location.svg" alt="иконка" width="31" height="31"/></div>
                    <div class="address__text">115280 г. Москва, ул. Мастеркова, дом 4. Бизнес-центр «Панорама»</div>
                  </div><a class="address__item" href="mailto:editor_site@mirq.ru?&amp;subject=Заголовок%20письма&amp;body=Содержимое%20письма">
                    <div class="address__icon"><img src="images/address/address-email.svg" alt="иконка" width="31" height="31"/></div>
                    <div class="address__text">editor_site@mirq.ru</div></a><a class="address__item" href="tel:+74957716652">
                    <div class="address__icon"><img src="images/address/address-phone.svg" alt="иконка" width="31" height="31"/></div>
                    <div class="address__text">+7 (495) 771 6652</div></a>
                </div>
              </address>
              <div class="contacts__map map"></div>
            </div>
            <div class="contacts__right">
              <form class="contacts__form form" action="#" data-validate-form="data-validate-form">
                <div class="form__header">
                  <h2 class="form__title">Остались вопросы?</h2>
                  <p class="form__text">Оставьте свои данные в форме ниже. Наши менеджеры ответят вам в скором времени.</p>
                </div>
                <div class="form__main">
                  <div class="form__top">
                    <div class="form__box">
                      <label class="form__label form__label--half">
                        <input class="form__input" type="text" placeholder="Имя" name="form-name" required="required"/><span class="form__error">Обязательное поле</span>
                      </label>
                      <label class="form__label form__label--half">
                        <input class="form__input" type="text" placeholder="Фамилия"/>
                      </label>
                      <label class="form__label">
                        <input class="form__input" type="email" placeholder="E-mail" name="form-email" required="required"/><span class="form__error">Обязательное поле</span>
                      </label>
                      <label class="form__label">
                        <textarea class="form__textarea" placeholder="Текст сообщения"></textarea>
                      </label>
                    </div>
                  </div>
                  <div class="form__middle">
                    <div class="agree">
                      <label class="agree__label">
                        <input type="checkbox" name="form-agree" required="required"/><span class="agree__checkbox"></span><span class="agree__text">Я согласен с <a href="#">Правилами обработки и хранения персональных данных</a></span>
                      </label><span class="agree__error">Обязательное поле</span>
                    </div>
                  </div>
                  <div class="form__bottom">
                    <button class="button form__button"><span>Подписаться</span>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
