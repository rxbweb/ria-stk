
<section class="section section--intro">
  <div class="section__wrapper container">
    <div class="section__content">
      <div class="intro">
        <div class="bg-image">
          <picture>
            <source srcset="images/intro/intro-bg-mob.webp" media="(max-width: 575px)" type="image/webp"/>
            <source srcset="images/intro/intro-bg-mob.jpg" media="(max-width: 575px)"/>

            <picture>
              <source srcset="images/intro/intro-01-mob.webp" media="(max-width: 575px)" type="image/webp"/>
